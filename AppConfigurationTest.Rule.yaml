---
# Synopsis: Keep local authentication enabled only in the fixture that must create key values through ARM.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: AppConfigurationKeyValueTestRequiresLocalAuthentication
spec:
  rule:
    - 'PSRule.Rules.Azure\Azure.AppConfig.DisableLocalAuth'
  if:
    field: tags.psRuleException
    equals: key-values-require-local-auth
