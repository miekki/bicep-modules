#
# PSRule configuration
#

# Please see the documentation for all configuration options:
# https://aka.ms/ps-rule-azure/options

# Require a minimum version of PSRule for Azure.
requires:
  PSRule.Rules.Azure: ">=1.47.0"

# Automatically use rules for Azure.
include:
  module:
    - PSRule.Rules.Azure

# Ignore all files except .bicepparam files.
input:
  pathIgnore:
    - "**"
    # Include test files from modules
    - "!modules/**/*.test.bicep"
    #- "!**/*.bicepparam"
    # Exclude bicepconfig.json
    #- "bicepconfig.json"
    # Exclude module files
    #- "modules/**/*.bicep"
    # Include test files from modules
    #- "!modules/**/*.tests.bicep"

# Test templates are expansion sources; their expanded Azure resources are
# evaluated, but the source files themselves do not match Azure rules.
execution:
  unprocessedObject: Debug

# Enable expansion of Azure .bicepparam files.
# PSRule's Bicep CLI settings are environment variables, not YAML options.
# For local runs with Azure CLI-managed Bicep, set
# PSRULE_AZURE_BICEP_USE_AZURE_CLI=true in the shell before running PSRule.
configuration:
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION: true
  AZURE_BICEP_CHECK_TOOL: true
  PSRULE_AZURE_BICEP_PATH: "/Users/maciej/.azure/bin/bicep"
  PSRULE_AZURE_BICEP_USE_AZURE_CLI: "true"
rule:
  exclude:
    - "AZR-000125" # exluded Azure.KeyVault.PurgeProtect. Enable Purge Protection on Key Vaults to prevent early purge of vaults and vault items.
