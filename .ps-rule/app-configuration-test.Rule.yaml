# Synopsis: Allow local auth only on the App Configuration test store that provisions key-values.
apiVersion: github.com/microsoft/PSRule/v1
kind: SuppressionGroup
metadata:
  name: AppConfigurationKeyValuesRequireLocalAuth
spec:
  rule:
    - Azure.AppConfig.DisableLocalAuth
  if:
    field: tags.psRuleException
    equals: key-values-require-local-auth
