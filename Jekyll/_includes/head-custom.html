{% assign catalog_assets = page.catalog_assets | default: '/Jekyll/assets' %}
<link
  rel="stylesheet"
  href="{{ catalog_assets | append: '/css/catalog.css' | relative_url }}"
>
<script>
  (() => {
    try {
      const theme = localStorage.getItem('catalog-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  })();
</script>
<script
  src="{{ catalog_assets | append: '/js/catalog.js' | relative_url }}"
  defer
></script>
