name: module-app-configuration
concurrency:
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "modules/config/app-configuration/**"
      - "modules/config/app-configuration-key-value/**"
      - "AppConfigurationTest.Rule.yaml"
  push:
    branches:
      - main
    paths:
      - "modules/config/app-configuration/**"
      - "modules/config/app-configuration-key-value/**"
      - "AppConfigurationTest.Rule.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate App Configuration modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build modules, tests, and examples
        run: |
          az bicep build --file modules/config/app-configuration/main.bicep
          az bicep build --file modules/config/app-configuration/test/main.test.bicep
          az bicep build --file modules/config/app-configuration/test/main.psrule.bicep
          az bicep build --file modules/config/app-configuration/examples/required-parameters/main.bicep
          az bicep build --file modules/config/app-configuration/examples/full-parameters/main.bicep
          az bicep build --file modules/config/app-configuration-key-value/main.bicep
          az bicep build --file modules/config/app-configuration-key-value/test/main.test.bicep
          az bicep build --file modules/config/app-configuration-key-value/test/main.psrule.bicep
          az bicep build --file modules/config/app-configuration-key-value/examples/required-parameters/main.bicep
          az bicep build --file modules/config/app-configuration-key-value/examples/full-parameters/main.bicep

      - name: Run Bicep module tests
        run: |
          az bicep run --command "test modules/config/app-configuration/test/main.test.bicep"
          az bicep run --command "test modules/config/app-configuration-key-value/test/main.test.bicep"

      - name: Run App Configuration PSRule analysis
        uses: microsoft/ps-rule@v2.9.0
        with:
          inputType: inputPath
          inputPath: modules/config/app-configuration/test/main.psrule.bicep
          modules: PSRule.Rules.Azure
          source: .

      - name: Run key-value PSRule analysis
        uses: microsoft/ps-rule@v2.9.0
        with:
          inputType: inputPath
          inputPath: modules/config/app-configuration-key-value/test/main.psrule.bicep
          modules: PSRule.Rules.Azure
          source: .

  call-shared-workflow:
    name: Run
    if: github.event_name != 'pull_request'
    needs: validate
    uses: ./.github/workflows/template-module.yml
    permissions:
      id-token: write
      contents: write
    with:
      module_name: app-configuration
      module_file_path: modules/config/app-configuration/main.bicep
      module_baseline_file_path: modules/config/app-configuration/metadata.json
      release_base_sha: ${{ github.event.before }}
      module_parameters: name=test-app-config tags='{"env":"dev"}' location=uksouth
    secrets: inherit
