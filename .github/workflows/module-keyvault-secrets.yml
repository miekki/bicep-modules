name: module-keyvault-secrets
concurrency:
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modules/security/keyvault-secrets/**"

permissions:
  id-token: write
  contents: write

jobs:
  call-shared-workflow:
    name: Run
    uses: ./.github/workflows/template-module.yml
    with:
      module_name: keyvault-secrets
      module_file_path: modules/security/keyvault-secrets/main.bicep
      module_baseline_file_path: modules/security/keyvault-secrets/metadata.json
      release_base_sha: ${{ github.event.before }}
      module_parameters: keyVaultName=test-keyvault Name=my-secret-name Value=my-secret-value
    secrets: inherit
